---
layout: default
---
<article>
<section class="page-head">
  <div class="wrap narrow">
    <p class="eyebrow"><a href="{{ '/insights/' | relative_url }}">{% if page.kind == 'observation' %}Observations{% else %}Insights{% endif %}</a> · {{ page.date | date: "%-d %B %Y" }}{% if page.author %} · {{ page.author }}{% endif %}</p>
    <h1 class="h2">{{ page.title }}</h1>
  </div>
</section>
<section class="section-tight">
  <div class="wrap narrow content prose-article">
    {{ content }}
    <p class="back-link"><a href="{{ '/insights/' | relative_url }}">← All insights</a></p>
  </div>
</section>
</article>
{% include cta.html %}
